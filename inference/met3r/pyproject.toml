[project]
name = "met3r-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.1",
    "torchvision",
    "iopath",
    "met3r",
    "ipykernel>=7.1.0",
    "notebook>=7.0"
]

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch==2.4.1"]
featup = ["torch==2.4.1"]

[tool.uv.sources]
met3r = { git = "https://github.com/mohammadasim98/met3r" }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
